<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Segoe UI, Arial, sans-serif" font-size="11">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="20" text-anchor="middle" font-size="14" font-weight="600">Host-connected embedded workbench (design; mocks in software)</text>

  <!-- Host -->
  <rect x="20" y="40" width="190" height="96" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="115" y="60" text-anchor="middle" font-weight="600">Host PC (Windows 11 x64)</text>
  <text x="115" y="78" text-anchor="middle">Workbench UI + C++ core</text>
  <text x="115" y="94" text-anchor="middle">IDeviceAdapter per device</text>
  <text x="115" y="110" text-anchor="middle">OpenOCD owns JTAG adapter</text>
  <text x="115" y="126" text-anchor="middle" fill="#64748b">USB host, protective earth</text>

  <!-- Hub -->
  <rect x="270" y="52" width="170" height="72" rx="8" fill="#f8fafc" stroke="#475569"/>
  <text x="355" y="74" text-anchor="middle" font-weight="600">Powered USB 2.0/3.x hub</text>
  <text x="355" y="92" text-anchor="middle">own 5 V supply, per-port</text>
  <text x="355" y="108" text-anchor="middle">current limit (≥ 900 mA)</text>
  <line x1="210" y1="88" x2="268" y2="88" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="239" y="82" text-anchor="middle">USB</text>

  <!-- MCU -->
  <rect x="20" y="200" width="200" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="120" y="220" text-anchor="middle" font-weight="600">MCU board (Cortex-M class)</text>
  <text x="120" y="238" text-anchor="middle">USB CDC-ACM telemetry</text>
  <text x="120" y="254" text-anchor="middle">5 V USB → 3.3 V LDO</text>
  <text x="120" y="270" text-anchor="middle">GPIO / UART at 3.3 V</text>
  <text x="120" y="286" text-anchor="middle">SWD/JTAG header (10-pin 1.27 mm)</text>
  <text x="120" y="302" text-anchor="middle" fill="#64748b">VTREF = 3.3 V</text>

  <!-- FPGA -->
  <rect x="500" y="200" width="200" height="110" rx="8" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="600" y="220" text-anchor="middle" font-weight="600">FPGA board (Artix-7 class)</text>
  <text x="600" y="238" text-anchor="middle">USB-UART status bridge</text>
  <text x="600" y="254" text-anchor="middle">1.0 V VCCINT, 1.8 V VCCAUX</text>
  <text x="600" y="270" text-anchor="middle">I/O banks 3.3 V or 1.8 V (VCCO)</text>
  <text x="600" y="286" text-anchor="middle">JTAG TAP on bank 0 (VCCO_0)</text>
  <text x="600" y="302" text-anchor="middle" fill="#64748b">ext. 12 V / 5 V barrel supply</text>

  <!-- JTAG adapter -->
  <rect x="260" y="200" width="200" height="110" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="360" y="220" text-anchor="middle" font-weight="600">JTAG debug adapter</text>
  <text x="360" y="238" text-anchor="middle">FT2232H-class, USB powered</text>
  <text x="360" y="254" text-anchor="middle">drives TCK, TMS, TDI, nTRST</text>
  <text x="360" y="270" text-anchor="middle">samples TDO; senses VTREF</text>
  <text x="360" y="286" text-anchor="middle">I/O buffers follow VTREF</text>
  <text x="360" y="302" text-anchor="middle" fill="#9a3412">debug interface, not compute</text>

  <!-- USB links from hub -->
  <path d="M300,124 L300,160 L120,160 L120,198" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M355,124 L355,198" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M410,124 L410,160 L600,160 L600,198" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="154" text-anchor="middle">USB (5 V, D+/D−)</text>
  <text x="372" y="176">USB</text>
  <text x="510" y="154" text-anchor="middle">USB-UART</text>

  <!-- JTAG cables -->
  <path d="M260,262 L222,262" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <path d="M460,262 L498,262" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="241" y="330" text-anchor="middle" fill="#9a3412">JTAG/SWD ribbon</text>
  <text x="479" y="330" text-anchor="middle" fill="#9a3412">JTAG 14-pin 2 mm</text>
  <text x="360" y="330" text-anchor="middle" fill="#9a3412">one target at a time (switch cable or select port)</text>

  <!-- MCU-FPGA link with level shifter -->
  <rect x="285" y="370" width="150" height="46" rx="6" fill="#fefce8" stroke="#ca8a04"/>
  <text x="360" y="390" text-anchor="middle" font-weight="600">Level shifter</text>
  <text x="360" y="406" text-anchor="middle">3.3 V ↔ 1.8 V (if VCCO = 1.8 V)</text>
  <path d="M120,310 L120,393 L283,393" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M437,393 L600,393 L600,312" fill="none" stroke="#a21caf" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="386" text-anchor="middle">UART/SPI 3.3 V</text>
  <text x="520" y="386" text-anchor="middle">bank I/O</text>

  <!-- Ground -->
  <line x1="20" y1="440" x2="700" y2="440" stroke="#0f172a" stroke-width="2"/>
  <text x="360" y="458" text-anchor="middle" font-weight="600">Common ground reference: single star point at hub/host; all JTAG GND pins connected; no ground loops via mains-earthed supplies</text>
</svg>
